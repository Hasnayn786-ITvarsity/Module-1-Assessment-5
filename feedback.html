<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <style>
            /* ONLY style the inputs - don't touch the main box */
            .fancy-input{
                background: #f2f2f2;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 12px;
                width: 100%;
                box-sizing: border-box;
                margin: 8px 0;
                font-family: Helvetica;
            }
            .row{
                display: flex;
                gap: 10px;
            }
            .row .fancy-input{
                width: 50%;
            }
            .fancy-btn{
                display: block;
                width: 50%;
                background: #2d5a27;
                color: white !important;
                text-align: center;
                padding: 12px;
                border-radius: 8px;
                text-decoration: none !important;
                font-weight: bold;
                margin: 15px auto;
            }
        </style>
    </head>
    <body>
        <div id="header">
            <img src="images/logo.png"/>
        </div>
        <div id="tabs-top">
            <a href="A.html">ANIMALS</a>
            <a href="index.html">MAP</a>
            <a href="places.html">PLACES</a>
        </div>
        <div id="main">
            <div id="content">
                <div id="info-box-full">
                    <img src="images/giraffe-large.jpg"/>
                    <h3>WE'D LOVE TO HEAR FROM YOU!</h3>
                    <p>We always strive to do better, so your feedback is important to us. Please fill in the form below.</p>
                    
                    <div class="row">
                        <input class="fancy-input" type="text" placeholder="Your Name"/>
                        <input class="fancy-input" type="text" placeholder="Your Email"/>
                    </div>
                    <textarea class="fancy-input" placeholder="Type your message here" style="height: 80px;"></textarea>
                    <a class="fancy-btn" href="Submit.html">SUBMIT</a>
                </div>
            </div>
        </div>
        <div id="tabs-bottom">
            <a href="weather.html">WEATHER</a>
            <a href="feedback.html">FEEDBACK</a>
        </div>
    </body>
</html>
